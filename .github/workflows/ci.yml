name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Tests
        run: python -m pytest backend/tests -q
      - name: JS-Syntaxcheck
        run: node --check frontend/js/app.js
